<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>8k IME</title>
  <meta name="description" content="A six-key predictive input method for keyboards and touch screens.">
  <meta name="theme-color" content="#141414">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <link rel="stylesheet" href="src/style.css">
  <script type="module" src="src/main.js"></script>
</head>
<body>
  <p id="loading" role="status">Loading dictionary…</p>

  <main id="app" hidden>
    <section class="output-wrap" aria-label="Output">
      <div id="output" class="output" tabindex="0" role="textbox" aria-readonly="true" aria-multiline="true"></div>
      <div class="tools">
        <button id="copy" type="button" disabled>Copy</button>
        <button id="clear" type="button" disabled>Clear</button>
      </div>
    </section>

    <section class="status" aria-label="Input">
      <div class="buffer-line">
        <span id="mode" class="mode" hidden></span>
        <span id="buffer" class="buffer" aria-live="polite"></span>
      </div>
      <div id="candidates" class="candidates" aria-label="Candidates"></div>
    </section>

    <section id="keypad" class="keypad" aria-label="Keys"></section>

    <details id="help" class="help">
      <summary>Keyboard map</summary>
      <div id="keymap" class="keymap"></div>
      <p class="hint">
        Colours show which key each physical key presses. The keyboard types only through this
        input method; <kbd>`</kbd> copies the output and <kbd>Esc</kbd> clears it.
      </p>
    </details>
  </main>

  <div id="toast" class="toast" role="status" hidden></div>
</body>
</html>
